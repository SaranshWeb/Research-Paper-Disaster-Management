<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Feedback</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            max-width: 600px;
            width: 90%;
            padding: 30px;
            background-color: #ffffff;
            border-radius: 12px;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.1);
            text-align: center;
            transition: box-shadow 0.3s ease;
        }

        .container:hover {
            box-shadow: 0 12px 25px rgba(0, 0, 0, 0.15);
        }

        h2 {
            color: #34495e;
            margin-bottom: 25px;
            font-size: 2em;
            font-weight: 600;
            border-bottom: 2px solid #ecf0f1;
            padding-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 10px;
            text-align: left;
            font-weight: 500;
            color: #2c3e50;
        }

        input[type="text"],
        input[type="tel"],
        textarea {
            width: calc(100% - 22px);
            padding: 11px;
            margin-bottom: 20px;
            border: 1px solid #bdc3c7;
            border-radius: 6px;
            font-size: 1em;
            transition: border-color 0.3s ease;
        }

        input[type="text"]:focus,
        input[type="tel"]:focus,
        textarea:focus {
            border-color: #3498db;
            outline: none;
        }

        textarea {
            resize: vertical;
            min-height: 120px;
        }

        input[type="submit"] {
            background-color: #3498db;
            color: white;
            padding: 12px 25px;
            border: none;
            border-radius: 6px;
            font-size: 1.1em;
            cursor: pointer;
            transition: background-color 0.3s ease, transform 0.2s ease;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }

        input[type="submit"]:hover {
            background-color: #2980b9;
            transform: translateY(-2px);
            box-shadow: 0 6px 12px rgba(0, 0, 0, 0.15);
        }

        .feedback-image {
            width: 100%;
            max-width: 450px;
            height: auto;
            display: block;
            margin: 30px auto;
            border-radius: 12px;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.2);
            transition: transform 0.3s ease;
        }

        .feedback-image:hover {
            transform: scale(1.03);
        }

        @media (max-width: 768px) {
            .container {
                padding: 25px;
            }

            h2 {
                font-size: 1.8em;
            }

            input[type="submit"] {
                padding: 10px 20px;
                font-size: 1em;
            }
        }
    </style>
</head>

<body>
    <div class="container">
        <h2>Provide Feedback Here...</h2>
        <form action="addfeedback" method="POST">
            <label for="name">Name:</label>
            <input type="text" id="name" name="name" required aria-label="Name">

            <label for="phone_no">Phone No.:</label>
            <input type="tel" id="phone_no" name="phone_no" required pattern="[0-9]{10}"
                title="Please enter a 10-digit phone number" aria-label="Phone Number">

            <label for="address">Address:</label>
            <input type="text" id="address" name="address" required aria-label="Address">

            <label for="feedback">Feedback:</label>
            <textarea id="feedback" name="feedback" required aria-label="Feedback"></textarea>

            <input type="submit" value="Submit">
        </form>

        <img src="https://www.bronkhorst.com/getmedia/a544790d-0950-4e68-bbf2-c19cbd0a136d/Your-Feedback-Matters.png?width=558&hash=yVkKvDAc%2FBWi%2BK0QCDy5l4l5ASK583yjFBxyynklFpU%3D"
            alt="Your Feedback Matters" class="feedback-image">
    </div>
</body>

</html>
