<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Disaster Emergency Chatbot</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            height: 100vh;
            margin: 0;
            background: linear-gradient(135deg, #6a11cb, #2575fc);
        }

        .chat-container {
            width: 450px;
            background-color: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.2);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            margin-bottom: 20px;
        }

        .chat-header {
            background: linear-gradient(to right, #6a11cb, #2575fc);
            color: white;
            padding: 20px;
            text-align: center;
            font-size: 1.5em;
            font-weight: 600;
        }

        .chat-box {
            height: 400px;
            overflow-y: auto;
            padding: 20px;
            background-color: #f9f9f9;
            display: flex;
            flex-direction: column;
            scroll-behavior: smooth;
        }

        .chat-box div {
            margin: 12px 0;
            padding: 15px;
            border-radius: 20px;
            font-size: 1em;
            max-width: 80%;
            word-wrap: break-word;
        }

        .user {
            background-color: #007bff;
            color: white;
            align-self: flex-end;
            text-align: right;
        }

        .bot {
            background-color: #e0e0e0;
            color: #333;
            align-self: flex-start;
            text-align: left;
        }

        /* Typing Indicator */
        .typing {
            font-style: italic;
            color: gray;
            padding: 10px;
            background: #f1f1f1;
            border-radius: 20px;
            align-self: flex-start;
            max-width: 80%;
            font-size: 0.9em;
        }

        .chat-input {
            display: flex;
            padding: 15px;
            background-color: #ffffff;
        }

        input[type="text"] {
            flex-grow: 1;
            padding: 15px;
            border: 1px solid #ddd;
            border-radius: 25px;
            margin-right: 10px;
            font-size: 1em;
            outline: none;
        }

        button {
            padding: 15px 25px;
            background: linear-gradient(to right, #6a11cb, #2575fc);
            color: white;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            font-weight: 600;
            transition: transform 0.2s;
        }

        button:hover {
            transform: translateY(-2px);
        }

        /* Back to Home Button */
        .home-button {
            display: inline-block;
            padding: 12px 25px;
            font-size: 1.1em;
            color: white;
            background-color: #ff5722;
            border: none;
            border-radius: 8px;
            text-decoration: none;
            transition: background-color 0.3s ease, transform 0.2s ease;
            text-align: center;
            margin-top: 10px;
            box-shadow: 0 6px 12px rgba(0, 0, 0, 0.15);
        }

        .home-button:hover {
            background-color: #e64a19;
            transform: translateY(-3px);
            box-shadow: 0 8px 16px rgba(0, 0, 0, 0.2);
        }
    </style>
</head>

<body>

    <div class="chat-container">
        <div class="chat-header">Disaster Alert Chatbot</div>
        <div class="chat-box" id="chatBox">
            <div class="bot">Hello! Ask me about recent earthquakes, cyclones, floods, droughts, landslides, or
                wildfires.</div>
        </div>
        <div class="chat-input">
            <input type="text" id="userInput" placeholder="Type your message..." />
            <button onclick="sendMessage()">Send</button>
        </div>
    </div>

    <!-- Back to Home Button -->
    <a href="index.html" class="home-button">Back to Home</a>

    <script>
        async function fetchEarthquakeData() {
            const url = "https://earthquake.usgs.gov/fdsnws/event/1/query?format=geojson&limit=6";
            try {
                const response = await fetch(url);
                const data = await response.json();
                return data.features.map(eq => `📍 ${eq.properties.place} | Magnitude: ${eq.properties.mag} | Time: ${new Date(eq.properties.time).toLocaleString()}`);
            } catch (error) {
                return ["⚠️ Error fetching earthquake data."];
            }
        }

        async function fetchWeatherAlerts(disasterType) {
            const url = "https://api.weather.gov/alerts?active=1";
            try {
                const response = await fetch(url);
                const data = await response.json();
                const filteredAlerts = data.features
                    .filter(alert => alert.properties.event.toLowerCase().includes(disasterType))
                    .slice(0, 6)
                    .map(alert => `⚠️ ${alert.properties.event} | ${alert.properties.areaDesc} | Severity: ${alert.properties.severity} | Issued: ${new Date(alert.properties.effective).toLocaleString()}`);

                return filteredAlerts.length > 0 ? filteredAlerts : [`No recent ${disasterType} alerts.`];
            } catch (error) {
                return [`⚠️ Error fetching ${disasterType} data.`];
            }
        }

        async function sendMessage() {
            const userInput = document.getElementById("userInput").value.trim().toLowerCase();
            const chatBox = document.getElementById("chatBox");

            if (!userInput) return;

            // Display user message
            const userMessage = document.createElement("div");
            userMessage.classList.add("user");
            userMessage.textContent = userInput;
            chatBox.appendChild(userMessage);

            // Show Typing Indicator
            const typingIndicator = document.createElement("div");
            typingIndicator.classList.add("typing");
            typingIndicator.textContent = "Bot is typing...";
            chatBox.appendChild(typingIndicator);
            chatBox.scrollTop = chatBox.scrollHeight;

            let botResponse = ["I'm sorry, I don't understand. Ask about earthquakes, cyclones, floods, droughts, landslides, or wildfires."];

            if (userInput.includes("earthquake")) {
                botResponse = await fetchEarthquakeData();
            } else if (userInput.includes("cyclone")) {
                botResponse = await fetchWeatherAlerts("cyclone");
            } else if (userInput.includes("flood")) {
                botResponse = await fetchWeatherAlerts("flood");
            } else if (userInput.includes("drought")) {
                botResponse = await fetchWeatherAlerts("drought");
            } else if (userInput.includes("landslide")) {
                botResponse = await fetchWeatherAlerts("landslide");
            } else if (userInput.includes("wildfire") || userInput.includes("fire")) {
                botResponse = await fetchWeatherAlerts("fire");
            }

            setTimeout(() => {
                typingIndicator.remove();
                botResponse.forEach(text => {
                    const botMessage = document.createElement("div");
                    botMessage.classList.add("bot");
                    botMessage.textContent = text;
                    chatBox.appendChild(botMessage);
                });
                chatBox.scrollTop = chatBox.scrollHeight;
            }, 2000);

            document.getElementById("userInput").value = "";
        }
    </script>

</body>

</html>
